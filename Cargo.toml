[workspace]
resolver = "2"
members = [
    "crates/veri-core",
    "crates/veri-js",
    "crates/veri-integrations",
    "crates/veri-testkit",
    "crates/veri",
    "crates/veri-daemon",
    "tools/veri-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/songomen/veri"

[workspace.dependencies]
wreq = { version = "=6.0.0-rc.29", features = [
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "stream",
] }
wreq-util = "=3.0.0-rc.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
